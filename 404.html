<!DOCTYPE html>
<html lang="en" data-theme="zerofy" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f0e7d4" />
  <title>Page not found | ZeroFy</title>
  <meta name="description" content="The page you are looking for cannot be found. Return to the ZeroFy homepage." />
  <link rel="icon" href="favicon/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
  <link rel="manifest" href="favicon/site.webmanifest" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/demo-themes.css" />
  <script>
    // Resolve the saved colour mode before first paint so the page never flashes.
    // The key is shared with the demos and the Zlog, so all of them follow the
    // same choice.
    (function () {
      var stored = null;
      try {
        stored = localStorage.getItem('zerofy-demo-mode');
      } catch (error) {
        stored = null;
      }
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-mode', stored || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
</head>
<body>
  <div id="page-transition" class="page-transition" aria-hidden="true"></div>

  <main class="section-light">
    <section class="hero" style="padding: 6rem 0;">
      <div class="container" style="text-align:center;">
        <p class="eyebrow">404</p>
        <h1>Page not found</h1>
        <p class="copy" style="margin-left:auto; margin-right:auto;">The page you tried to reach does not exist or may have moved. Use the link below to return home.</p>
        <div class="hero-actions" style="justify-content:center;">
          <a href="index.html" class="button button-primary" id="return-home">Back to ZeroFy</a>
          <a href="contact.html" class="button button-secondary">Contact us</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const returnHomeLink = document.getElementById('return-home');
    if (returnHomeLink) {
      returnHomeLink.addEventListener('click', (event) => {
        event.preventDefault();
        localStorage.removeItem('zerofy-cookie-consent');
        window.location.href = 'index.html';
      });
    }
  </script>
  <script src="js/theme.js"></script>
</body>
</html>
